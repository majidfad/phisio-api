<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>صفحه پیدا نشد · Zivan</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7fb;
        --surface: #ffffff;
        --text: #142033;
        --muted: #5b6b82;
        --accent: #2e5bcc;
        --border: #d7e0ef;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Tahoma, 'Segoe UI', sans-serif;
        background:
          radial-gradient(circle at top right, rgba(46, 91, 204, 0.12), transparent 40%),
          linear-gradient(180deg, #eef3fb 0%, var(--bg) 100%);
        color: var(--text);
      }

      main {
        width: min(100%, 440px);
        padding: 32px 28px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 18px 40px rgba(20, 32, 51, 0.08);
      }

      .code {
        display: inline-block;
        margin-bottom: 12px;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(46, 91, 204, 0.1);
        color: var(--accent);
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 1.45rem;
        line-height: 1.4;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
        font-size: 0.98rem;
      }

      a {
        display: inline-block;
        margin-top: 22px;
        padding: 10px 18px;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }

      .en {
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        font-size: 0.88rem;
        direction: ltr;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="code">404</div>
      <h1>این صفحه پیدا نشد</h1>
      <p>آدرس واردشده معتبر نیست یا دیگر در دسترس نیست.</p>
      <a href="https://zivan.me">بازگشت به زیوان</a>
      <p class="en">Page not found. This host or path is not available.</p>
    </main>
  </body>
</html>
